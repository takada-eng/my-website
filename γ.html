<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>じゃんけん</title>





<body>

<h1>じゃんけん大会</h1>

<p>好きな手を選んでください！</p>

<button onclick="play('グー')">グー</button>
<button onclick="play('チョキ')">チョキ</button>
<button onclick="play('パー')"> パー</button>

<div id="player"></div>
<div id="computer"></div>

<h2 id="result"></h2>

<script>

function play(player){

    const hands=["グー","チョキ","パー"];

    const computer=hands[Math.floor(Math.random()*3)];

    document.getElementById("player").innerHTML=
    "あなた：<strong>"+player+"</strong>";

    document.getElementById("computer").innerHTML=
    "コンピューター：<strong>"+computer+"</strong>";

    let result="";

    if(player===computer){
        result="あいこ！";
    }
    else if(
        (player==="グー" && computer==="チョキ")||
        (player==="チョキ" && computer==="パー")||
        (player==="パー" && computer==="グー")
    ){
        result="あなたの勝ち";
    }else{
        result="あなたの負け";
    }

    document.getElementById("result").innerHTML=result;
}

</script>

</body>
</html>
